{% extends "base.html" %}
{% block content %}
<h2>Boundary Map</h2>

<div style="text-align: center; margin-bottom: 30px;">
    <!-- Simple conceptual SVG boundary map as requested -->
    <svg width="300" height="400" viewBox="0 0 300 400" style="background: white; border: 1px solid #ccc; border-radius: 8px;">
        <rect x="50" y="20" width="200" height="40" fill="#f8f9fa" stroke="#333" />
        <text x="150" y="45" font-family="sans-serif" font-size="14" text-anchor="middle">PROPOSAL</text>
        
        <line x1="150" y1="60" x2="150" y2="100" stroke="#333" marker-end="url(#arrow)" />
        
        <rect x="50" y="100" width="200" height="60" fill="#e9ecef" stroke="#333" />
        <text x="150" y="125" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">ARMORIQ</text>
        <text x="150" y="145" font-family="sans-serif" font-size="12" text-anchor="middle">allow / deny</text>
        
        <line x1="150" y1="160" x2="150" y2="200" stroke="#333" marker-end="url(#arrow)" />
        
        <rect x="50" y="200" width="200" height="80" fill="#e9ecef" stroke="#333" />
        <text x="150" y="225" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">TRIPLINE</text>
        <text x="150" y="245" font-family="sans-serif" font-size="12" text-anchor="middle">jail / egress</text>
        <text x="150" y="265" font-family="sans-serif" font-size="12" text-anchor="middle">canary / witness</text>
        
        <line x1="150" y1="280" x2="150" y2="320" stroke="#333" marker-end="url(#arrow)" />
        
        <rect x="50" y="320" width="200" height="40" fill="#f8f9fa" stroke="#333" />
        <text x="150" y="345" font-family="sans-serif" font-size="14" text-anchor="middle">MCP TOOL</text>
        
        <defs>
            <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                <path d="M 0 0 L 10 5 L 0 10 z" />
            </marker>
        </defs>
    </svg>
</div>

<table>
    <thead>
        <tr>
            <th>Attack Class</th>
            <th>ArmorIQ</th>
            <th>Tripline</th>
            <th>Neither</th>
        </tr>
    </thead>
    <tbody>
        {% for cls, stops in matrix.items() %}
        <tr>
            <td>{{ cls }}</td>
            <td>{{ '✓' if stops.armoriq else '' }}</td>
            <td>{{ '✓' if stops.tripline else '' }}</td>
            <td>{{ '✓' if stops.neither else '' }}</td>
        </tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
