{% extends "base.html" %}
{% block title %}Implementation Status{% endblock %}
{% block content %}
<div class="page-header animate-card">
    <h1 class="page-title">TRIPLINE IMPLEMENTATION STATUS</h1>
    <div class="page-subtitle">Current production readiness, verifiable phases, and validation criteria.</div>
</div>

<div class="card animate-card" style="border-left: 4px solid var(--accent);">
    <div class="card-title">DOCUMENTATION SOURCE: docs/STATUS.md</div>
    <div style="font-family: var(--font-mono); font-size: 13px; line-height: 1.7; color: var(--text); white-space: pre-wrap; background: var(--surface-2); padding: 20px; border-radius: 6px; overflow-x: auto;">{{ content }}</div>
</div>
{% endblock %}
